name: upstream-beta

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke-beta:
    runs-on: ubuntu-latest
    # Builds the same docker/Dockerfile as ci.yml's docker-smoke job (pi +
    # Hermes from scratch, no layer cache) — mirroring its 60-minute budget so
    # a slow build isn't cancelled by timeout before the failure step below
    # can run (a timeout cancellation does not satisfy `if: failure()`, so a
    # tighter budget could silently swallow the signal this workflow exists
    # to raise).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Smoke against the core image's beta channel
        env:
          # The Studio design on the next core, for a person to look at.
          STUDIO_SHOTS_DIR: ${{ runner.temp }}/studio-shots
        run: |
          grep -q '^KYOUBE_CORE_VERSION=' scripts/smoke.env
          sed -i 's/^KYOUBE_CORE_VERSION=.*/KYOUBE_CORE_VERSION=beta/' scripts/smoke.env
          grep -q '^KYOUBE_CORE_VERSION=beta$' scripts/smoke.env
          bash scripts/smoke.sh
      - name: Upload the Studio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-screenshots-beta
          path: ${{ runner.temp }}/studio-shots
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "The core image's :beta channel breaks the KyoubeAI smoke test";
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "upstream" });
            if (open.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ["upstream"],
              body: `The weekly build against ghcr.io/paperclipai/paperclip:beta failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Check the plugin SDK changelog before bumping KYOUBE_CORE_VERSION.` });
